<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — Salma Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* ============ PAGE INSCRIPTION ============ */
  .signup-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--blush);
    padding: 2em 1.5em;
  }

  .signup-card {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border-radius: var(--radius);
    padding: 2.5em 2em;
    box-shadow: 0 30px 60px -20px rgba(110, 27, 52, 0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5em;
  }

  .signup-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
  }

  .signup-title {
    text-align: center;
  }
  .signup-title h1 {
    font-size: 1.6rem;
    margin-bottom: 0.3em;
  }
  .signup-title p {
    font-size: 0.9rem;
    margin: 0;
  }

  .signup-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1.1em;
  }

  .signup-footer {
    font-size: 0.85rem;
    color: #8a6270;
    text-align: center;
  }
  .signup-footer a {
    color: var(--rose-dark);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="signup-page">
  <div class="signup-card">

    <a href="index.html" class="signup-logo">
      <span class="logo-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2.5 2v1.5l3.5-1 3.5 1V21l-2.5-2v-5.5z"/>
        </svg>
      </span>
      <span class="logo">Salma<span>Travel</span></span>
    </a>

    <div class="signup-title">
      <h1>Créez votre compte</h1>
      <p>Rejoignez Salma Travel pour planifier votre prochain voyage.</p>
    </div>

    <form class="signup-form" id="signup-form" novalidate>
      <div class="form-row">
        <label for="fullname">Nom complet</label>
        <input type="text" id="fullname" name="fullname" required>
        <span class="form-error" id="error-fullname"></span>
      </div>
      <div class="form-row">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" name="email" required>
        <span class="form-error" id="error-signup-email"></span>
      </div>
      <div class="form-row">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required>
        <span class="form-error" id="error-password"></span>
      </div>
      <button type="submit" class="btn btn-primary btn-block">S'inscrire</button>
      <p class="form-success" id="signup-success" hidden>Compte créé avec succès ! Bienvenue chez Salma Travel. ✈️</p>
    </form>

    <p class="signup-footer">Déjà membre ? <a href="index.html">Retour à l'accueil</a></p>

  </div>
</div>

<script>
  const signupForm = document.getElementById('signup-form');
  const signupSuccess = document.getElementById('signup-success');

  function setSignupError(fieldId, message) {
    const errorEl = document.getElementById(`error-${fieldId}`);
    if (errorEl) errorEl.textContent = message;
  }

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  signupForm.addEventListener('submit', (e) => {
    e.preventDefault();
    let valid = true;

    const fullname = document.getElementById('fullname').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('password').value;

    setSignupError('fullname', '');
    setSignupError('signup-email', '');
    setSignupError('password', '');

    if (fullname.length < 2) {
      setSignupError('fullname', 'Merci d\'indiquer votre nom complet.');
      valid = false;
    }
    if (!isValidEmail(email)) {
      setSignupError('signup-email', 'Merci d\'indiquer un email valide.');
      valid = false;
    }
    if (password.length < 6) {
      setSignupError('password', 'Le mot de passe doit contenir au moins 6 caractères.');
      valid = false;
    }

    if (valid) {
      signupSuccess.hidden = false;
      signupForm.reset();
    }
  });
</script>

</body>
</html>
